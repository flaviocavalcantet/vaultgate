{{- $ctx := dict "root" . "name" "api" }}
{{- $api := .Values.api }}
{{- if and $api.nodes.enabled (not (and .Values.mtls.enabled .Values.openbao.enabled)) }}
{{- fail "api.nodes.enabled needs mtls.enabled (the root, to verify nodes) and openbao.enabled (the agent signs)" }}
{{- end }}
# The control plane. Migrations run as it starts, one replica at a time (they hold a
# Postgres advisory lock).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vaultgate.fullname" $ctx }}
  labels: {{- include "vaultgate.labels" $ctx | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/env-var-secret: "VAULTGATE_SECRETS_DIR is a directory's path"
spec:
  replicas: {{ $api.replicas }}
  selector:
    matchLabels: {{- include "vaultgate.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "vaultgate.labels" $ctx | nindent 8 }}
      {{- with include "vaultgate.podAnnotations" $ctx | trim }}
      annotations: {{- . | nindent 8 }}
      {{- end }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      automountServiceAccountToken: false
      {{- include "vaultgate.affinity" $ctx | nindent 6 }}
      {{- include "vaultgate.serviceAccount" $ctx | nindent 6 }}
      {{- include "vaultgate.openbaoInit" $ctx | nindent 6 }}
      containers:
        - name: api
          image: {{ include "vaultgate.image" $ctx }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "vaultgate.commonEnv" . | nindent 12 }}
            {{- include "vaultgate.tlsEnv" $ctx | nindent 12 }}
            - name: VAULTGATE_PORT
              value: {{ $api.port | quote }}
            - name: VAULTGATE_DOCS_ENABLED
              value: {{ $api.docs | quote }}
            - name: VAULTGATE_INTERNAL_PORT
              value: {{ $api.internalPort | quote }}
            - name: VAULTGATE_PUBLIC_API_URL
              value: {{ $api.publicUrl | quote }}
            - name: VAULTGATE_GATEWAY_PUBLIC_URL
              value: {{ $api.gatewayPublicUrl | quote }}
            - name: VAULTGATE_OIDC_ISSUER
              value: {{ $api.oidc.issuer | quote }}
            - name: VAULTGATE_OIDC_AUDIENCE
              value: {{ $api.oidc.audience | quote }}
            {{- with $api.oidc.discoveryUrl }}
            - name: VAULTGATE_OIDC_DISCOVERY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if $api.nodesCa.enabled }}
            - name: VAULTGATE_OPENBAO_ADDRESS
              value: {{ .Values.openbao.address | quote }}
            - name: VAULTGATE_NODES_PKI_MOUNT
              value: {{ $api.nodesCa.mount | quote }}
            {{- end }}
            {{- if $api.nodes.enabled }}
            # Node enrollment: nodes' certificates from the root on the nodes' port, and
            # signing through the agent's API proxy (vaultgate.apiAgentConfig).
            - name: VAULTGATE_NODES_PORT
              value: {{ $api.nodes.port | quote }}
            - name: VAULTGATE_NODES_CLIENT_CA_FILE
              value: /etc/vaultgate/client-ca/ca.crt
            - name: VAULTGATE_OPENBAO_AGENT_ADDRESS
              value: http://127.0.0.1:8100
            {{- end }}
            {{- with .Values.scanQueueUrl }}
            - name: VAULTGATE_SCAN_QUEUE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.trustedProxies }}
            - name: VAULTGATE_TRUSTED_PROXIES
              value: {{ . | quote }}
            {{- end }}
            {{- with $api.smtp.host }}
            - name: VAULTGATE_SMTP_HOST
              value: {{ . | quote }}
            - name: VAULTGATE_SMTP_PORT
              value: {{ $api.smtp.port | quote }}
            {{- end }}
            {{- include "vaultgate.credentialEnv" (dict "root" . "env" "VAULTGATE_DATABASE_URL" "key" "database-url") | nindent 12 }}
            {{- include "vaultgate.credentialEnv" (dict "root" . "env" "VAULTGATE_INTERNAL_TOKEN" "key" "internal-token") | nindent 12 }}
            {{- include "vaultgate.credentialEnv" (dict "root" . "env" "VAULTGATE_SCANNER_TOKEN" "key" "scanner-token") | nindent 12 }}
            {{- include "vaultgate.extraEnv" $api.env | nindent 12 }}
          ports:
            - { name: http, containerPort: {{ $api.port }} }
            - { name: internal, containerPort: {{ $api.internalPort }} }
            {{- if $api.nodes.enabled }}
            - { name: nodes, containerPort: {{ $api.nodes.port }} }
            {{- end }}
            - { name: metrics, containerPort: {{ .Values.metrics.port }} }
          {{- $scheme := ternary "HTTPS" "HTTP" .Values.tls.enabled }}
          readinessProbe: { httpGet: { path: {{ $api.readinessPath }}, port: http, scheme: {{ $scheme }} } }
          livenessProbe: { httpGet: { path: /healthz, port: http, scheme: {{ $scheme }} } }
          # Room for the migrations on a first start.
          startupProbe: { httpGet: { path: /healthz, port: http, scheme: {{ $scheme }} }, periodSeconds: 5, failureThreshold: 36 }
          securityContext: {{- include "vaultgate.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml $api.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- include "vaultgate.openbaoMount" $ctx | nindent 12 }}
            {{- include "vaultgate.tlsMount" $ctx | nindent 12 }}
            {{- include "vaultgate.trustMount" . | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        {{- include "vaultgate.openbaoVolumes" $ctx | nindent 8 }}
        {{- include "vaultgate.tlsVolume" $ctx | nindent 8 }}
        {{- include "vaultgate.trustVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vaultgate.fullname" $ctx }}
  labels: {{- include "vaultgate.labels" $ctx | nindent 4 }}
  {{- if .Values.ingress.enabled }}
  {{- with .Values.ingress.serviceAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  selector: {{- include "vaultgate.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: {{ $api.port }}, targetPort: http }
    # For the gateway and the scanner only. Never expose this port through an Ingress.
    - { name: internal, port: {{ $api.internalPort }}, targetPort: internal }
    {{- if $api.nodes.enabled }}
    # For enrolled nodes, with their certificates: TLS passthrough only (the API
    # terminates it, to see the client certificate), never an HTTP Ingress.
    - { name: nodes, port: {{ $api.nodes.port }}, targetPort: nodes }
    {{- end }}
    # In-cluster only. Never expose this port through an Ingress.
    - { name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics }
{{- with $api.nodePort }}
---
# The public port on every node (local clusters): a Service of its own, so the other
# ports never get a node port.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vaultgate.fullname" $ctx }}-nodeport
  labels: {{- include "vaultgate.labels" $ctx | nindent 4 }}
spec:
  type: NodePort
  selector: {{- include "vaultgate.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: {{ $api.port }}, targetPort: http, nodePort: {{ . }} }
{{- end }}
{{- if and $api.nodes.enabled $api.nodes.nodePort }}
---
# The nodes' port on every node (local clusters).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vaultgate.fullname" $ctx }}-nodes-nodeport
  labels: {{- include "vaultgate.labels" $ctx | nindent 4 }}
spec:
  type: NodePort
  selector: {{- include "vaultgate.selector" $ctx | nindent 4 }}
  ports:
    - { name: nodes, port: {{ $api.nodes.port }}, targetPort: nodes, nodePort: {{ $api.nodes.nodePort }} }
{{- end }}
