{{- range $name := list "api" "gateway" }}
{{- $svc := index $.Values $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: vaultgate }
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: vaultgate }
      {{- if $.Values.metrics.podAnnotations }}
      # For Prometheus setups that discover pods by annotation.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $.Values.metrics.port | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      securityContext: {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/vaultgate-{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: VAULTGATE_METRICS_PORT
              value: {{ $.Values.metrics.port | quote }}
          ports:
            - { name: http, containerPort: {{ $svc.port }} }
            - { name: metrics, containerPort: {{ $.Values.metrics.port }} }
          readinessProbe: { httpGet: { path: {{ $svc.readinessPath }}, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml $svc.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: vaultgate }
spec:
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports:
    - { name: http, port: {{ $svc.port }}, targetPort: http }
    # In-cluster only. Never expose this port through an Ingress.
    - { name: metrics, port: {{ $.Values.metrics.port }}, targetPort: metrics }
{{- end }}
