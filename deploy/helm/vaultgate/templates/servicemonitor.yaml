{{- if .Values.metrics.serviceMonitor.enabled }}
# Scrape config for clusters running the Prometheus Operator (kube-prometheus-stack).
# Requires the monitoring.coreos.com/v1 CRDs; leave disabled otherwise.
{{- range $name := list "api" "gateway" "scanner" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: vaultgate
    {{- with $.Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # The job label matches the local Prometheus config, so dashboards and alert rules
  # work unchanged in the cluster.
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $.Values.metrics.serviceMonitor.interval }}
      {{- if $.Values.tls.enabled }}
      # The metrics port speaks TLS too: Prometheus verifies it with the trust bundle.
      scheme: https
      tlsConfig:
        ca: { configMap: { name: {{ $.Values.tls.trustBundle.configMap }}, key: {{ $.Values.tls.trustBundle.key }} } }
        serverName: {{ $.Release.Name }}-{{ $name }}.{{ $.Release.Namespace }}.svc
      {{- end }}
{{- end }}
{{- end }}
