{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name := list "api" "gateway" }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vaultgate.fullname" $ctx }}
  labels: {{- include "vaultgate.labels" $ctx | nindent 4 }}
spec:
  maxUnavailable: 1
  # A pod that isn't ready serves nothing: evicting it never makes things worse, and a
  # stuck one must not block a node drain.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: {{- include "vaultgate.selector" $ctx | nindent 6 }}
{{- end }}
{{- end }}
