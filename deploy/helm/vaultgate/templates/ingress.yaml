{{- if .Values.ingress.enabled }}
{{- $ing := .Values.ingress }}
{{- $issued := and .Values.tls.enabled (not $ing.tls) }}
{{- if $issued }}
# The ingress's certificate for both hosts, from the chart's issuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    app.kubernetes.io/part-of: vaultgate
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  secretName: {{ .Release.Name }}-ingress-tls
  issuerRef: {{- toYaml .Values.tls.issuerRef | nindent 4 }}
  duration: {{ .Values.tls.duration }}
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  usages: [digital signature, server auth]
  dnsNames: [{{ $ing.apiHost }}, {{ $ing.gatewayHost }}]
---
{{- end }}
# The public ports only: the API's internal port and every metrics port stay in-cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/part-of: vaultgate
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with $ing.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $issued }}
  tls:
    - secretName: {{ .Release.Name }}-ingress-tls
      hosts: [{{ $ing.apiHost }}, {{ $ing.gatewayHost }}]
  {{- else }}
  {{- with $ing.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  rules:
    - host: {{ $ing.apiHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-api, port: { name: http } } }
    - host: {{ $ing.gatewayHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-gateway, port: { name: http } } }
{{- end }}
