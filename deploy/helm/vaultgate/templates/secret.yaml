{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}
# Local clusters only (secrets.create): elsewhere this Secret is created out of band.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.name }}
  labels:
    app.kubernetes.io/part-of: vaultgate
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  database-url: {{ required "secrets.databaseUrl is required with secrets.create" $s.databaseUrl | quote }}
  internal-token: {{ required "secrets.internalToken is required with secrets.create" $s.internalToken | quote }}
  scanner-token: {{ required "secrets.scannerToken is required with secrets.create" $s.scannerToken | quote }}
  {{- with $s.awsAccessKeyId }}
  aws-access-key-id: {{ . | quote }}
  {{- end }}
  {{- with $s.awsSecretAccessKey }}
  aws-secret-access-key: {{ . | quote }}
  {{- end }}
{{- end }}
