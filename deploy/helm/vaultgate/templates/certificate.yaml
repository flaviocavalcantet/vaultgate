{{- if .Values.tls.enabled }}
{{- range $name := list "api" "gateway" }}
{{- $ctx := dict "root" $ "name" $name }}
{{- $fullname := include "vaultgate.fullname" $ctx }}
---
# The {{ $name }}'s server certificate, under the Service's names. cert-manager keeps the
# key in the Secret (a new one at each renewal) and renews before a third of the
# certificate's life is left; the {{ $name }} loads the renewed pair as it runs.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}
  labels: {{- include "vaultgate.labels" $ctx | nindent 4 }}
spec:
  secretName: {{ $fullname }}-tls
  issuerRef: {{- toYaml $.Values.tls.issuerRef | nindent 4 }}
  duration: {{ $.Values.tls.duration }}
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  usages: [digital signature, server auth]
  dnsNames:
    - {{ $fullname }}.{{ $.Release.Namespace }}.svc
    - {{ $fullname }}.{{ $.Release.Namespace }}.svc.cluster.local
    {{- range $.Values.tls.extraDnsNames }}
    - {{ . }}
    {{- end }}
{{- end }}
{{- end }}
