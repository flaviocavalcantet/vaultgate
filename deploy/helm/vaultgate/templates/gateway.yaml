{{- $ctx := dict "root" . "name" "gateway" }}
{{- $gw := .Values.gateway }}
# The data plane: streams uploads and downloads, encrypting and decrypting on the fly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vaultgate.fullname" $ctx }}
  labels: {{- include "vaultgate.labels" $ctx | nindent 4 }}
spec:
  {{- if not $gw.autoscaling.enabled }}
  replicas: {{ $gw.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "vaultgate.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "vaultgate.labels" $ctx | nindent 8 }}
      {{- with include "vaultgate.podAnnotations" $ctx | trim }}
      annotations: {{- . | nindent 8 }}
      {{- end }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      automountServiceAccountToken: false
      {{- include "vaultgate.serviceAccount" $ctx | nindent 6 }}
      {{- include "vaultgate.openbaoInit" $ctx | nindent 6 }}
      # Transfers in progress get time to finish when a pod is scaled down.
      terminationGracePeriodSeconds: 120
      containers:
        - name: gateway
          image: {{ include "vaultgate.image" $ctx }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "vaultgate.commonEnv" . | nindent 12 }}
            {{- include "vaultgate.tlsEnv" $ctx | nindent 12 }}
            - name: VAULTGATE_GATEWAY_PORT
              value: {{ $gw.port | quote }}
            - name: VAULTGATE_API_INTERNAL_URL
              value: {{ include "vaultgate.apiInternalUrl" . | quote }}
            - name: VAULTGATE_BUCKET
              value: {{ .Values.storage.bucket | quote }}
            - name: VAULTGATE_KMS_KEY_ID
              value: {{ .Values.storage.kmsKeyId | quote }}
            {{- with .Values.trustedProxies }}
            - name: VAULTGATE_TRUSTED_PROXIES
              value: {{ . | quote }}
            {{- end }}
            {{- include "vaultgate.credentialEnv" (dict "root" . "env" "VAULTGATE_INTERNAL_TOKEN" "key" "internal-token") | nindent 12 }}
            {{- include "vaultgate.extraEnv" $gw.env | nindent 12 }}
          ports:
            - { name: http, containerPort: {{ $gw.port }} }
            - { name: metrics, containerPort: {{ .Values.metrics.port }} }
          {{- $scheme := ternary "HTTPS" "HTTP" .Values.tls.enabled }}
          readinessProbe: { httpGet: { path: {{ $gw.readinessPath }}, port: http, scheme: {{ $scheme }} } }
          livenessProbe: { httpGet: { path: /healthz, port: http, scheme: {{ $scheme }} } }
          securityContext: {{- include "vaultgate.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml $gw.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- include "vaultgate.openbaoMount" $ctx | nindent 12 }}
            {{- include "vaultgate.tlsMount" $ctx | nindent 12 }}
            {{- include "vaultgate.trustMount" . | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        {{- include "vaultgate.openbaoVolumes" $ctx | nindent 8 }}
        {{- include "vaultgate.tlsVolume" $ctx | nindent 8 }}
        {{- include "vaultgate.trustVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vaultgate.fullname" $ctx }}
  labels: {{- include "vaultgate.labels" $ctx | nindent 4 }}
  {{- if .Values.ingress.enabled }}
  {{- with .Values.ingress.serviceAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  selector: {{- include "vaultgate.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: {{ $gw.port }}, targetPort: http }
    # In-cluster only. Never expose this port through an Ingress.
    - { name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics }
{{- with $gw.nodePort }}
---
# The public port on every node (local clusters): a Service of its own, so the other
# ports never get a node port.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vaultgate.fullname" $ctx }}-nodeport
  labels: {{- include "vaultgate.labels" $ctx | nindent 4 }}
spec:
  type: NodePort
  selector: {{- include "vaultgate.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: {{ $gw.port }}, targetPort: http, nodePort: {{ . }} }
{{- end }}
