# VaultGate on Kubernetes: the API, the streaming gateway and the PII scanner worker.
# Dependencies (PostgreSQL, S3, KMS, SQS, an OIDC provider, SMTP) are not part of this
# chart; point the settings below at them. deploy/k3d holds the values for the local
# cluster, where they run in-cluster too.

image:
  # Images are named <registry>/vaultgate-<api|gateway|scanner>:<tag>. CI publishes them
  # to GHCR on every merge to main, tagged with the commit (M12). Argo CD sets the tag to
  # the commit it syncs (deploy/argocd), so the chart and the images are of one commit;
  # a plain `helm install` should set it too. `main` is the latest merge, and moves.
  registry: ghcr.io/flaviocavalcantet
  tag: main
  pullPolicy: IfNotPresent

# Settings shared by the services that use them.
aws:
  region: ap-northeast-1
  # LocalStack, for local clusters; empty in AWS.
  endpointUrl: ""
storage:
  bucket: vaultgate-local-vault
  kmsKeyId: alias/vaultgate-local
scanQueueUrl: ""
# Reverse proxies (the ingress controller) whose X-Forwarded-For is believed,
# comma-separated networks. Proxy addresses only, never client networks.
trustedProxies: ""
# Web origins whose pages may call the API and the gateway (CORS, M12.5): where the web
# frontend is served, each as scheme://host[:port], e.g. ["https://vault.example.com"].
# An exact list, no wildcards. Empty: no page of another origin gets an answer it may
# read. Being listed grants nothing else: every request still needs its token.
corsOrigins: []

# Credentials, read from one Secret with the keys:
#   database-url           PostgreSQL URL for the API (postgresql+asyncpg://...)
#   internal-token         the gateway's secret for the API's internal routes
#   scanner-token          the scanner's secret for its internal routes
#   aws-access-key-id      optional: leave out to use the pod's identity (IRSA)
#   aws-secret-access-key  optional, likewise
secrets:
  name: vaultgate
  # Create that Secret from the values below. For local clusters only: elsewhere it is
  # created out of band (External Secrets, Sealed Secrets, Vault), so no credential
  # lives in git.
  create: false
  databaseUrl: ""
  internalToken: ""
  scannerToken: ""
  awsAccessKeyId: ""
  awsSecretAccessKey: ""

# The services' credentials from OpenBao instead of the Secret above (M9, ADR 0012).
# Each pod runs the OpenBao agent first, as an init container: it logs in as the pod's
# own service account (<release>-api, -gateway, -scanner, which OpenBao's roles of the
# same names expect), writes that service's secrets as files to a memory-backed volume,
# and exits. The services read them through VAULTGATE_SECRETS_DIR, and the AWS SDKs
# through AWS_SHARED_CREDENTIALS_FILE. Needs tls.enabled: OpenBao is verified with the
# trust bundle. The agent's configuration: files/openbao-agent/<service>.hcl.
# Mutual TLS on the API's internal port (M10, ADR 0013), with tls.enabled: the gateway
# and the scanner present client certificates naming them (a URI,
# spiffe://<trustDomain>/ns/<namespace>/sa/<release>-<component>), and the API accepts
# only those from the root in rootSecret, each on its own routes. The shared tokens stay
# required too. The certificates come from an Issuer in the release's namespace (so no
# other namespace can get one) that signs through OpenBao's vaultgate-client role; its
# login is the service account <release>-client-issuer, for which cert-manager mints
# tokens.
mtls:
  enabled: false
  trustDomain: vaultgate
  # A Secret in the release's namespace with the root's certificate (key ca.crt): what
  # the API verifies client certificates against, and the Issuer OpenBao's server.
  rootSecret: vaultgate-root-ca
  # OpenBao's role that signs client certificates, and cert-manager's own identity.
  signPath: pki/sign/vaultgate-client
  openbaoRole: cert-manager-clients
  certManager: { namespace: cert-manager, serviceAccount: cert-manager }

openbao:
  enabled: false
  address: https://openbao.openbao.svc:8200
  image: openbao/openbao:2.7.2
  # The API's database credentials come from OpenBao's database engine (this role),
  # short-lived and its own per pod; the agent writes them into a URL for this database.
  database:
    role: vaultgate-api
    host: postgres.vaultgate-deps.svc
    port: 5432
    name: vaultgate

api:
  replicas: 2
  port: 8000
  # The gateway's and the scanner's port; reachable from those pods only when
  # networkPolicy.enabled.
  internalPort: 8001
  # /readyz also checks the database, so a pod without one receives no traffic.
  readinessPath: /readyz
  # The interactive documentation and the OpenAPI document on the public port (/docs,
  # /redoc, /openapi.json): off, so a deployment doesn't map its routes for anyone (M10,
  # TM-6). The local cluster turns them on: ZAP scans from the OpenAPI document.
  docs: false
  # Publish the nodes' CA (M11, ADR 0014) at /pki/nodes/...: its certificate, revocation
  # lists and OCSP responder, from this OpenBao mount, at openbao.address (verified with
  # the trust bundle: needs tls.enabled, and the API's egress to OpenBao). Off, those
  # routes answer 404.
  nodesCa:
    enabled: false
    mount: pki-nodes
  # Node enrollment (M11, ADR 0014): nodes ask for certificates on the public port
  # (/nodes/enrollments), admins approve them (/admin/nodes), and enrolled nodes call
  # the nodes' port with their certificates (mutual TLS, a node's identity from the
  # root in mtls.rootSecret), where they renew. Certificates are signed through the
  # API's OpenBao agent (its API proxy, on the pod's loopback). Needs mtls.enabled and
  # openbao.enabled. People never use the nodes' port: browsers stay on the public one.
  nodes:
    enabled: false
    port: 8002
    # Publish the nodes' port on every node at this port (local clusters), as nodePort.
    nodePort: ""
    # First trust by AWS instance identity: documents verified with the certificates in
    # this Secret (key certificates.pem: AWS's, for the RSA signature, for your regions),
    # from these accounts (none: off), in these regions (none: any), launched at most
    # maxLaunchAgeSeconds ago (0: no limit).
    aws:
      certificatesSecret: ""
      accounts: []
      regions: []
      maxLaunchAgeSeconds: 0
  # Set to also publish the public port on every node at this port (an extra NodePort
  # Service with that port only), as the local k3d cluster does; empty behind an Ingress.
  nodePort: ""
  # Where clients reach the API and the gateway; links and intents carry these
  # (https with tls.enabled).
  publicUrl: http://localhost:8000
  gatewayPublicUrl: http://localhost:8888
  oidc:
    # Must equal the tokens' iss claim.
    issuer: http://localhost:8080/realms/vaultgate
    # Where the API fetches discovery and keys, when not at the issuer's address.
    discoveryUrl: ""
    audience: vaultgate-api
  smtp:
    host: ""
    port: 25
  # Any other VAULTGATE_* setting (see the README), as NAME: value.
  env: {}
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

gateway:
  replicas: 2
  port: 8888
  readinessPath: /healthz
  nodePort: ""
  env: {}
  resources:
    # The CPU request is what the autoscaler's utilization is measured against.
    requests: { cpu: 200m, memory: 128Mi }
    # Memory stays flat regardless of upload size; that is the point of streaming.
    limits: { memory: 256Mi }
  # Horizontal Pod Autoscaler on CPU, which tracks the encryption work (ADR 0003).
  # While enabled, the autoscaler owns the replica count (replicas above is ignored).
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    # Scale on the transfers in progress too (M12, ADR 0016): uploads and downloads
    # streaming now, which CPU misses when clients are slow. Needs KEDA in the cluster
    # and the gateway's metrics in Prometheus (metrics.serviceMonitor, or a scrape job
    # that labels them job="gateway"). The chart then creates a KEDA ScaledObject with
    # both signals, in place of the HorizontalPodAutoscaler: KEDA manages one itself.
    transfers:
      enabled: false
      # Transfers in progress each pod should carry: above it on average, pods are
      # added. Keep it under the load one pod holds comfortably (docs/load-testing.md).
      perPod: 8
      # Prometheus' address, as KEDA's operator reaches it.
      prometheusAddress: ""
      # How often KEDA asks Prometheus.
      pollingIntervalSeconds: 15

scanner:
  replicas: 1
  # Files scanned at once per pod; each holds a PDF engine of up to 512 MiB.
  concurrency: 2
  env: {}
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1536Mi }

# The web frontend (vaultgate-frontend, M12.5, ADR 0019), optional: its own image, a
# static app served by nginx as a non-root user. It is told the API's, the gateway's and
# the identity provider's addresses (api.publicUrl, api.gatewayPublicUrl,
# api.oidc.issuer) and sends a Content-Security-Policy that allows only those. Its
# public address must also be in corsOrigins, and among the redirect addresses of the
# identity provider's client.
frontend:
  enabled: false
  image:
    # The frontend's own repository publishes it, tagged with its commit: a pinned tag,
    # bumped on purpose, not VaultGate's image.tag.
    repository: ghcr.io/flaviocavalcantet/vaultgate-frontend
    tag: ""
  # The OpenID Connect public client the app signs in with (PKCE).
  oidcClientId: vaultgate-web
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }
  # As the API's: an extra NodePort Service for local clusters; empty behind an Ingress.
  nodePort: ""

# TLS on the API's ports and the gateway's (M9, ADR 0012), with certificates from
# cert-manager (its CRDs installed), and the trust bundle every VaultGate client
# verifies against. Off, the services speak plain HTTP.
tls:
  enabled: false
  # The issuer that signs the certificates.
  issuerRef: { kind: ClusterIssuer, name: vaultgate-ca }
  # Short-lived: cert-manager renews them with a third of their life left, and the
  # services load the new pair without a restart.
  duration: 24h
  # Names on the API's, gateway's and scanner's certificates besides their Services' own
  # (<release>-api.<namespace>.svc and .svc.cluster.local): localhost for NodePorts. The
  # metrics ports serve TLS too, and the ServiceMonitors verify them with the bundle.
  extraDnsNames: []
  # A ConfigMap in the release's namespace (trust-manager writes it) whose key replaces
  # the services' trust store (SSL_CERT_FILE): the roots their clients accept.
  trustBundle: { configMap: vaultgate-ca, key: ca-certificates.crt }

# Optional Ingress for the API and the gateway (e.g. Traefik in k3d).
ingress:
  enabled: false
  className: ""
  # The controller's own settings, on the Ingress. Rate limits (M10): the API and the
  # gateway limit per user and per transfer themselves (see the README), so the
  # controller only needs a coarse ceiling per client address, against floods before
  # they reach a pod: well above what one user may do, as a NAT can hold many users.
  # For example, with ingress-nginx, 50 requests a second and 32 connections per
  # address: nginx.ingress.kubernetes.io/limit-rps: "50" and
  # nginx.ingress.kubernetes.io/limit-connections: "32" (Traefik: a RateLimit and an
  # InFlightReq middleware). Keep the connection ceiling above the gateway's 16
  # transfers per address.
  annotations: {}
  apiHost: api.vaultgate.localhost
  gatewayHost: gateway.vaultgate.localhost
  # The frontend's host, when frontend.enabled.
  frontendHost: vaultgate.localhost
  # TLS for those hosts, as Ingress spec.tls: [{ secretName: ..., hosts: [...] }].
  # Anywhere but a local cluster, bearer tokens and files must not travel in plain HTTP:
  # set it (cert-manager issues the certificate from it, with its annotation above).
  # Left empty with tls.enabled, the chart has cert-manager issue the ingress's
  # certificate for both hosts from tls.issuerRef (Secret <release>-ingress-tls).
  tls: []
  # With tls.enabled the backends (the API's and the gateway's ports) speak HTTPS only,
  # so the controller must too, and should verify them with the trust bundle. How is
  # the controller's own setting; these annotations go on the API's and the gateway's
  # Services. Traefik: traefik.ingress.kubernetes.io/service.serversscheme: https, and
  # traefik.ingress.kubernetes.io/service.serverstransport naming a ServersTransport
  # whose rootCAs is the bundle. (ingress-nginx reads the Ingress's annotations instead:
  # backend-protocol HTTPS, proxy-ssl-verify "on", proxy-ssl-secret.)
  serviceAnnotations: {}

# NetworkPolicies (templates/networkpolicy.yaml). Needs a CNI that enforces them (k3s
# does). In: the public ports from anyone, the metrics ports from metricsNamespace only,
# the API's internal port from the gateway and the scanner only. Out: DNS, the API's
# internal port for the gateway and the scanner, and the rules under egress, nothing
# else. List there everything a component reaches, as NetworkPolicy egress rules with
# the pods' own ports, not the Services':
# - the API: PostgreSQL, the identity provider (discovery and keys), SQS, SMTP,
#   OpenBao and the tracing endpoint when used;
# - the gateway: S3 and KMS, OpenBao, tracing;
# - the scanner: S3, KMS and SQS, OpenBao, tracing.
# AWS's endpoints are outside the cluster: an ipBlock with port 443, ideally narrowed to
# VPC endpoints. values-k3d.yaml has the local cluster's.
networkPolicy:
  enabled: false
  metricsNamespace: monitoring
  egress:
    api: []
    gateway: []
    scanner: []

# Voluntary disruptions (node drains, upgrades) take down one API or gateway pod at a time.
podDisruptionBudget:
  enabled: true

# Traces (ADR 0008): an OTLP/HTTP endpoint, such as an in-cluster Alloy or OpenTelemetry
# Collector (http://alloy.monitoring:4318). Empty, the services record no spans.
tracing:
  otlpEndpoint: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  # Mounted files (the TLS key) are readable by this group only.
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }

# Prometheus metrics, served on a separate port that is never routed publicly.
metrics:
  port: 9100
  # prometheus.io/* pod annotations, for Prometheus setups that discover by annotation.
  # Turn off when using the ServiceMonitor below, or pods may be scraped twice.
  podAnnotations: true
  # ServiceMonitor objects for the Prometheus Operator (needs its CRDs installed).
  serviceMonitor:
    enabled: false
    interval: 15s
    # Extra labels, e.g. the `release` label your Prometheus selects ServiceMonitors by.
    labels: {}
