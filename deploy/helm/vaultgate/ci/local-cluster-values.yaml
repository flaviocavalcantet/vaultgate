# Every optional part on, as on the local k3d cluster: rendered and schema-checked in
# CI (helm job). Development values only.
image:
  registry: k3d-vaultgate-registry.localhost:5000
  tag: dev
  pullPolicy: Always
aws:
  endpointUrl: http://localstack.vaultgate-deps:4566
scanQueueUrl: http://localstack.vaultgate-deps:4566/000000000000/vaultgate-local-scans
trustedProxies: 10.42.0.0/16
secrets:
  create: true
  databaseUrl: postgresql+asyncpg://vaultgate:vaultgate@postgres.vaultgate-deps:5432/vaultgate
  internalToken: dev-internal-token-change-me
  scannerToken: dev-scanner-token-change-me
  awsAccessKeyId: test
  awsSecretAccessKey: test
api:
  oidc:
    discoveryUrl: http://keycloak.vaultgate-deps:8080/realms/vaultgate/.well-known/openid-configuration
  smtp:
    host: mailpit.vaultgate-deps
    port: 1025
  env:
    VAULTGATE_LOG_LEVEL: DEBUG
gateway:
  autoscaling:
    enabled: true
ingress:
  enabled: true
  className: traefik
networkPolicy:
  enabled: true
tracing:
  otlpEndpoint: http://alloy.monitoring:4318
metrics:
  podAnnotations: false
  serviceMonitor:
    enabled: true
