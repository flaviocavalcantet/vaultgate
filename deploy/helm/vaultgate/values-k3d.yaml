# The local k3d cluster (deploy/k3d): the
# dependencies in the vaultgate-deps namespace, and the public ports on the same host
# ports as docker compose (8000 for the API, 8888 for the gateway). No credentials here:
# they come from OpenBao.
# The images are the chart's own (GHCR, tagged with the commit Argo CD syncs): published
# by CI for main, built and loaded into the node for anything else (scripts/k3d.sh).

# The web frontend: its development server (vaultgate-frontend, `npm run dev`) and the
# cluster's own (frontend below), the origins the local Keycloak client `vaultgate-web`
# allows too.
corsOrigins: ["http://localhost:5173", "https://localhost:5174"]

# The web frontend in the cluster (M12.5, ADR 0019), on https://localhost:5174, with a
# certificate from the cluster's CA like the API and the gateway. The image is the
# frontend repository's, at a pinned commit: bump it on purpose.
frontend:
  enabled: true
  image:
    tag: 24e4c3632722347d8009bdafbf35c718caa89102
  replicas: 1
  nodePort: 30174

aws:
  endpointUrl: http://localstack.vaultgate-deps:4566
scanQueueUrl: http://localstack.vaultgate-deps:4566/000000000000/vaultgate-local-scans
# No proxy in front (NodePorts): the address the services see, the node's after
# kube-proxy, is the client's, so no X-Forwarded-For is trusted.

# The credentials come from OpenBao (M9, ADR 0012): `make k3d-up` seeds them there with
# random values (scripts/service_secrets.py), and no Secret holds them.
secrets:
  create: false
openbao:
  enabled: true

# TLS on the API and the gateway (M9, ADR 0012): certificates from OpenBao's
# intermediate through cert-manager, and the root in trust-manager's bundle
# (deploy/k3d/pki). localhost is on them for the NodePorts, so the host verifies too.
tls:
  enabled: true
  extraDnsNames: [localhost]

# Client certificates for the gateway and the scanner on the API's internal port.
mtls:
  enabled: true

api:
  replicas: 1
  docs: true
  nodesCa: { enabled: true }
  nodes:
    enabled: true
    nodePort: 30802
    # The local stand-in for AWS (scripts/k3d.sh), and a made-up account.
    aws: { certificatesSecret: vaultgate-aws-iid, accounts: ["000000000000"] }
  nodePort: 30800
  publicUrl: https://localhost:8000
  gatewayPublicUrl: https://localhost:8888
  oidc:
    # Tokens carry iss=https://localhost:8080/realms/vaultgate (Keycloak's KC_HOSTNAME);
    # the API fetches discovery and keys from the Service, over TLS too.
    issuer: https://localhost:8080/realms/vaultgate
    discoveryUrl: https://keycloak.vaultgate-deps.svc:8080/realms/vaultgate/.well-known/openid-configuration
  smtp:
    host: mailpit.vaultgate-deps
    port: 1025
  env:
    # The user OWASP ZAP scans as (make k3d-zap) skips the per-user rate limits, which it
    # would otherwise mostly be scanning. Never a person, and only on this cluster.
    VAULTGATE_RATE_LIMIT_EXEMPT_USERS: '["zap-scanner"]'
    # The per-address limits (share recipients, the nodes' CA, node enrollment), off
    # here: every client of this cluster, ZAP included, arrives from the host's one
    # address, and the limits' 429s partway through a scan read to ZAP's comparing rules
    # as a change of behaviour (it took one for SQL injection). The API's unit tests
    # cover the limits.
    VAULTGATE_RATE_LIMIT_SHARE_ACCESS_PER_MINUTE: "0"
    VAULTGATE_RATE_LIMIT_PKI_PER_MINUTE: "0"
    VAULTGATE_RATE_LIMIT_ENROLL_PER_MINUTE: "0"

gateway:
  nodePort: 30888
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    # On transfers in progress too, with KEDA (deploy/argocd/local) reading the count
    # from the cluster's Prometheus. Low, for a small cluster; the load tests' transfers
    # are too quick to reach it (docs/load-testing.md), slow clients would.
    transfers:
      enabled: true
      perPod: 4
      prometheusAddress: http://kps-prometheus.monitoring:9090

# Where each component may connect besides DNS and the API's internal port: the local
# cluster's dependencies, by namespace and pod, on their pods' ports.
networkPolicy:
  enabled: true
  egress:
    api:
      - &openbao
        to:
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: openbao } }
            podSelector: { matchLabels: { app.kubernetes.io/name: openbao } }
        ports: [{ port: 8200 }]
      - &alloy
        to:
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
            podSelector: { matchLabels: { app.kubernetes.io/name: alloy } }
        ports: [{ port: 4318 }]
      - &localstack # S3, KMS and SQS
        to:
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: vaultgate-deps } }
            podSelector: { matchLabels: { app.kubernetes.io/name: localstack } }
        ports: [{ port: 4566 }]
      - to:
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: vaultgate-deps } }
            podSelector: { matchLabels: { app.kubernetes.io/name: postgres } }
        ports: [{ port: 5432 }]
      - to: # Keycloak's discovery and keys (its Service's 8080 is the pod's 8443)
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: vaultgate-deps } }
            podSelector: { matchLabels: { app.kubernetes.io/name: keycloak } }
        ports: [{ port: 8443 }]
      - to: # Mailpit, for share codes
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: vaultgate-deps } }
            podSelector: { matchLabels: { app.kubernetes.io/name: mailpit } }
        ports: [{ port: 1025 }]
    gateway: [*openbao, *alloy, *localstack]
    scanner: [*openbao, *alloy, *localstack]

# Prometheus (kube-prometheus-stack) finds the services through ServiceMonitors, and
# traces go to Alloy in the monitoring namespace (deploy/k3d/observability).
metrics:
  podAnnotations: false
  serviceMonitor:
    enabled: true
tracing:
  # Alloy's OTLP receiver serves TLS (deploy/k3d/observability).
  otlpEndpoint: https://alloy.monitoring.svc:4318
