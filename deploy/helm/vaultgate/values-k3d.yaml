# The local k3d cluster (deploy/k3d): images from the cluster's own registry, the
# dependencies in the vaultgate-deps namespace, and the public ports on the same host
# ports as docker compose (8000 for the API, 8888 for the gateway). No credentials here:
# they come from OpenBao.
image:
  # The cluster's registry, as its nodes reach it (deploy/k3d/cluster.yaml).
  registry: vaultgate-registry.localhost:5000
  tag: dev
  # Rebuilt images keep the tag: a restarted pod pulls the new one.
  pullPolicy: Always

aws:
  endpointUrl: http://localstack.vaultgate-deps:4566
scanQueueUrl: http://localstack.vaultgate-deps:4566/000000000000/vaultgate-local-scans
# No proxy in front (NodePorts): the address the services see, the node's after
# kube-proxy, is the client's, so no X-Forwarded-For is trusted.

# The credentials come from OpenBao (M9, ADR 0012): `make k3d-up` seeds them there with
# random values (scripts/service_secrets.py), and no Secret holds them.
secrets:
  create: false
openbao:
  enabled: true

# TLS on the API and the gateway (M9, ADR 0012): certificates from OpenBao's
# intermediate through cert-manager, and the root in trust-manager's bundle
# (deploy/k3d/pki). localhost is on them for the NodePorts, so the host verifies too.
tls:
  enabled: true
  extraDnsNames: [localhost]

# Client certificates for the gateway and the scanner on the API's internal port.
mtls:
  enabled: true

api:
  replicas: 1
  nodePort: 30800
  publicUrl: https://localhost:8000
  gatewayPublicUrl: https://localhost:8888
  oidc:
    # Tokens carry iss=https://localhost:8080/realms/vaultgate (Keycloak's KC_HOSTNAME);
    # the API fetches discovery and keys from the Service, over TLS too.
    issuer: https://localhost:8080/realms/vaultgate
    discoveryUrl: https://keycloak.vaultgate-deps.svc:8080/realms/vaultgate/.well-known/openid-configuration
  smtp:
    host: mailpit.vaultgate-deps
    port: 1025
  env:
    # The user OWASP ZAP scans as (make k3d-zap) skips the per-user rate limits, which it
    # would otherwise mostly be scanning. Never a person, and only on this cluster.
    VAULTGATE_RATE_LIMIT_EXEMPT_USERS: '["zap-scanner"]'

gateway:
  nodePort: 30888
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3

networkPolicy:
  enabled: true

# Prometheus (kube-prometheus-stack) finds the services through ServiceMonitors, and
# traces go to Alloy in the monitoring namespace (deploy/k3d/observability).
metrics:
  podAnnotations: false
  serviceMonitor:
    enabled: true
tracing:
  # Alloy's OTLP receiver serves TLS (deploy/k3d/observability).
  otlpEndpoint: https://alloy.monitoring.svc:4318
