# GitOps: ArgoCD watches this repo and keeps the cluster in sync with the Helm chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultgate
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/flaviocavalcantet/vaultgate
    targetRevision: main
    path: deploy/helm/vaultgate
    helm:
      # The images of the commit being synced (M12): CI publishes them tagged with it.
      parameters:
        - name: image.tag
          value: $ARGOCD_APP_REVISION
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultgate
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
