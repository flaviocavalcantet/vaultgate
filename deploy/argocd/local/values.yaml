# Set by `make k3d-up` (the root Application's Helm parameters): which repo and which
# revision every application below syncs, so a branch can be tried before it is merged.
repoURL: https://github.com/flaviocavalcantet/vaultgate
revision: main
# The upstream chart's version (ADR 0010); bump it on purpose.
kubePrometheusStack: 92.21.1
# cert-manager and trust-manager (M9, ADR 0012), likewise.
certManager: v1.21.3
trustManager: v0.25.0
# KEDA (M12, ADR 0016), likewise: the gateway's autoscaler on transfers in progress.
keda: 2.21.0
