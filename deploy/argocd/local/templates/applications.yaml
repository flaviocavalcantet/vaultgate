# The dependencies, OpenBao, cert-manager and the Prometheus Operator first (sync wave
# 0), then what needs their CRDs: the observability and trust-manager (wave 1), the
# cluster's certificate issuer and trust bundle (wave 2), then VaultGate (wave 3), whose
# ServiceMonitors and Certificates need them. A sync that runs before what it needs is ready fails
# and is retried; the API waits for PostgreSQL by restarting until its migrations run.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultgate-deps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: deploy/k3d/deps
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultgate-deps
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
---
# OpenBao, the certificate authority and secret store (M9, ADR 0012). Its TLS certificate
# and seal key are Secrets that `make k3d-up` creates first; the intermediate CA is
# installed by the ceremony once it runs (scripts/pki.py).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultgate-openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: deploy/k3d/openbao
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultgate
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: deploy/helm/vaultgate
    helm:
      releaseName: vaultgate
      valueFiles: [values-k3d.yaml]
      # The images of the commit being synced (M12).
      parameters:
        - name: image.tag
          value: $ARGOCD_APP_REVISION
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultgate
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
---
# Prometheus Operator, Prometheus, Alertmanager and Grafana (ADR 0010): the upstream
# chart at a pinned version, with deploy/k3d/kube-prometheus-stack.yaml from this repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: {{ .Values.kubePrometheusStack }}
      helm:
        releaseName: kps
        valueFiles: ["$values/deploy/k3d/kube-prometheus-stack.yaml"]
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # The operator's CRDs are too large for client-side apply's annotation.
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
---
# Loki, Tempo and Alloy, and VaultGate's alert rules, dashboards and data sources, from
# the same files as compose (deploy/k3d/observability).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultgate-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: deploy/k3d/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
---
# cert-manager (M9, ADR 0012): the upstream chart at a pinned version, with its CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: {{ .Values.certManager }}
    helm:
      releaseName: cert-manager
      valuesObject:
        crds: { enabled: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
---
# trust-manager: copies the trust bundle into every namespace. Its webhook's certificate
# comes from cert-manager, hence wave 1. Its trust namespace is cert-manager's, where
# the root's Secret is.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trust-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: trust-manager
    targetRevision: {{ .Values.trustManager }}
    helm:
      releaseName: trust-manager
      valuesObject:
        app:
          trust: { namespace: cert-manager }
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
---
# The cluster's certificate issuer (through OpenBao) and trust bundle (deploy/k3d/pki).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultgate-pki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: deploy/k3d/pki
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
