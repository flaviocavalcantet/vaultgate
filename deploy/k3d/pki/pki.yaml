# Certificates for VaultGate's services (M9, ADR 0012): cert-manager signs them through
# OpenBao's intermediate CA, and trust-manager hands the root to every namespace. The
# root's certificate comes from `make k3d-up` (the Secret vaultgate-root-ca, created
# after the PKI ceremony), never from git: until it exists the issuer isn't ready, and
# certificate requests wait instead of failing into cert-manager's hour-long backoff.

# The identity cert-manager logs in to OpenBao with (its cert-manager role): no
# Kubernetes permissions, no pod runs as it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-issuer
automountServiceAccountToken: false
---
# cert-manager mints that account's tokens itself, each for one issuer's audience.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-issuer-token
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [openbao-issuer]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-issuer-token
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-issuer-token
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
# Signs CSRs under OpenBao's vaultgate-service role: service names (*.svc,
# *.cluster.local) and localhost, a day at a time. The key of each certificate is
# generated by cert-manager in the cluster and never sent anywhere.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vaultgate-ca
spec:
  vault:
    server: https://openbao.openbao.svc:8200
    path: pki/sign/vaultgate-service
    caBundleSecretRef: { name: vaultgate-root-ca, key: ca.crt }
    auth:
      kubernetes:
        role: cert-manager
        serviceAccountRef: { name: openbao-issuer }
---
# The frontend's development server over HTTPS (vaultgate-frontend's `npm run dev:k3d`):
# a localhost certificate from the same issuer, renewed like the others, which
# `make dev-cert` copies to the developer's machine. Local cluster only.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vaultgate-dev-localhost
spec:
  secretName: vaultgate-dev-localhost-tls
  issuerRef: { kind: ClusterIssuer, name: vaultgate-ca }
  duration: 24h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  usages: [digital signature, server auth]
  dnsNames: [localhost]
---
# What VaultGate's clients trust: the root, and the public CAs (Debian's bundle, for
# anything outside the cluster), as one file in a ConfigMap in every namespace.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: vaultgate-ca
spec:
  sources:
    - useDefaultCAs: true
    - secret: { name: vaultgate-root-ca, key: ca.crt }
  target:
    configMap: { key: ca-certificates.crt }
