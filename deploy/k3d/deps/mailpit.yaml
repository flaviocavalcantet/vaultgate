# Catches every email the stack sends (share verification codes); the UI and API are on
# localhost:8025, and nothing leaves the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailpit }
    spec:
      # The image's nobody: Mailpit needs no user of its own.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.33.1
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp } # its message database
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: http, port: 8025, targetPort: http }
---
# The UI and API on the host (localhost:8025): a Service of its own, so SMTP never gets
# a node port.
apiVersion: v1
kind: Service
metadata:
  name: mailpit-ui
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: http, port: 8025, targetPort: http, nodePort: 30025 }
