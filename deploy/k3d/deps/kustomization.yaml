# What VaultGate depends on, in the cluster for local use only (ADR 0009): PostgreSQL,
# LocalStack (S3, KMS, SQS), Keycloak with the vaultgate realm, and Mailpit. Synced by
# ArgoCD (deploy/argocd/local) into the vaultgate-deps namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vaultgate-deps
resources:
  - postgres.yaml
  - localstack.yaml
  - keycloak.yaml
  - mailpit.yaml
configMapGenerator:
  # The same realm docker compose imports (outside this directory, hence ArgoCD's
  # --load-restrictor LoadRestrictionsNone, set in deploy/k3d/argocd).
  - name: keycloak-realm
    files:
      - ../../../infra/keycloak/vaultgate-realm.json
      # The load test's users (M8), imported next to the realm.
      - ../../../infra/keycloak/vaultgate-users-0.json
labels:
  - pairs:
      app.kubernetes.io/part-of: vaultgate-deps
