# Single-process Loki, with the compose config: filesystem storage, 7 days.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
data:
  loki.yml: |- {{- .Files.Get "files/loki.yml" | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  labels: { app.kubernetes.io/name: loki }
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: loki }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loki }
      annotations:
        checksum/config: {{ .Files.Get "files/loki.yml" | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loki
          image: {{ .Values.images.loki }}
          args: ["-config.file=/etc/loki/loki.yml"]
          ports:
            - { name: http, containerPort: 3100 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # it writes only to its data volume
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/loki, readOnly: true }
            - { name: data, mountPath: /loki }
      volumes:
        - name: config
          configMap: { name: loki }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: { app.kubernetes.io/name: loki }
spec:
  selector: { app.kubernetes.io/name: loki }
  ports:
    - { name: http, port: 3100, targetPort: http }
