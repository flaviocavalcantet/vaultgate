# Alloy on every node: tails that node's pod log files to Loki, and receives the
# services' traces (OTLP/HTTP) for Tempo. Config: observability/alloy/kubernetes.alloy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
# Read-only: which pods run on the node, so their log files can be found and labelled.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vaultgate-alloy
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vaultgate-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vaultgate-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
data:
  config.alloy: |- {{- .Files.Get "files/alloy.alloy" | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  labels: { app.kubernetes.io/name: alloy }
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "reads the node's root-owned pod logs"
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: alloy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alloy }
      annotations:
        checksum/config: {{ .Files.Get "files/alloy.alloy" | sha256sum }}
    spec:
      serviceAccountName: alloy
      # The node's pod log files belong to root; Alloy only reads them (read-only mount).
      securityContext: { runAsUser: 0, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: alloy
          image: {{ .Values.images.alloy }}
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - --disable-reporting
            - /etc/alloy/config.alloy
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports:
            - { name: http, containerPort: 12345 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          # Root for the log files' ownership, but nothing else: reading them needs only
          # DAC_READ_SEARCH, and the only writable paths are its state and /tmp.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"], add: ["DAC_READ_SEARCH"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy, readOnly: true }
            - { name: tls, mountPath: /etc/alloy/tls, readOnly: true }
            - { name: pod-logs, mountPath: /var/log/pods, readOnly: true }
            - { name: data, mountPath: /var/lib/alloy/data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: tls
          secret: { secretName: alloy-tls, defaultMode: 0440 }
        - name: config
          configMap: { name: alloy }
        - name: pod-logs
          hostPath: { path: /var/log/pods }
        # Read positions; on the node, so a restarted pod does not send logs again.
        - name: data
          hostPath: { path: /var/lib/vaultgate-alloy, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels: { app.kubernetes.io/name: alloy }
spec:
  selector: { app.kubernetes.io/name: alloy }
  ports:
    - { name: http, port: 12345, targetPort: http }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
# The OTLP receiver's certificate (M9, ADR 0012): the services send their traces over TLS.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alloy
  labels: { app.kubernetes.io/name: alloy }
spec:
  secretName: alloy-tls
  issuerRef: { kind: ClusterIssuer, name: vaultgate-ca }
  duration: 24h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  usages: [digital signature, server auth]
  dnsNames:
    - alloy.{{ .Release.Namespace }}.svc
    - alloy.{{ .Release.Namespace }}.svc.cluster.local
