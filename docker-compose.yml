# Local development stack. Everything here is free: no cloud account is needed.
# The project name is fixed because Alloy collects logs by compose project label.
name: vaultgate

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vaultgate
      POSTGRES_PASSWORD: vaultgate
      POSTGRES_DB: vaultgate
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultgate"]
      interval: 5s
      retries: 10

  # Emulates S3 and KMS so Terraform and the services can run against "AWS" locally.
  # Pinned: the AWS provider's S3 lifecycle resource needs a LocalStack that returns
  # TransitionDefaultMinimumObjectSize (4.x); releases from 2026.03 on need an auth token.
  localstack:
    image: localstack/localstack:4.4.0
    environment:
      SERVICES: s3,kms,sqs,iam
    ports: ["4566:4566"]

  # OIDC identity provider for local SSO testing. The `vaultgate` realm (clients,
  # groups, seed users) is imported from infra/keycloak on every start; dev mode keeps
  # no state between runs.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens always carry iss=http://localhost:8080/realms/vaultgate, whether Keycloak
      # is reached from the browser (localhost:8080) or from other containers
      # (keycloak:8080); back-channel URLs such as the JWKS endpoint follow the caller.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    # Admin console with admin/admin: loopback only.
    ports: ["127.0.0.1:8080:8080"]

  api:
    build: ./api
    environment:
      VAULTGATE_DATABASE_URL: postgresql+asyncpg://vaultgate:vaultgate@postgres:5432/vaultgate
      # Must equal the token's iss claim, which is fixed by KC_HOSTNAME above.
      VAULTGATE_OIDC_ISSUER: http://localhost:8080/realms/vaultgate
      # Inside this network localhost:8080 is the API container itself, so discovery
      # and JWKS are fetched from the keycloak service directly.
      VAULTGATE_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/vaultgate/.well-known/openid-configuration
      # Shared secret for the internal API (port 8001, gateway only, not published on
      # the host). Local development value; real deployments inject a random secret.
      VAULTGATE_INTERNAL_TOKEN: dev-internal-token-change-me
      # The scanner worker's secret for its internal routes (local value, like the above).
      VAULTGATE_SCANNER_TOKEN: dev-scanner-token-change-me
      # Scan requests go to this queue, created by `make tf-local`. Until it exists the
      # API's resender keeps trying; uploads still complete.
      VAULTGATE_SCAN_QUEUE_URL: http://localstack:4566/000000000000/vaultgate-local-scans
      VAULTGATE_AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Share verification codes go to Mailpit, which catches them (UI on :8025).
      VAULTGATE_SMTP_HOST: mailpit
      VAULTGATE_SMTP_PORT: "1025"
      # Traces go to Alloy, which forwards them to Tempo (ADR 0008). While Alloy is not
      # running, spans are dropped and the service works as before.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }

  gateway:
    build: ./gateway
    environment:
      VAULTGATE_API_INTERNAL_URL: http://api:8001
      VAULTGATE_INTERNAL_TOKEN: dev-internal-token-change-me
      # Bucket and key alias are created by `make tf-local` (infra/terraform/envs/local).
      VAULTGATE_BUCKET: vaultgate-local-vault
      VAULTGATE_KMS_KEY_ID: alias/vaultgate-local
      VAULTGATE_AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    ports: ["8888:8888"]
    depends_on: [api, localstack]

  # Catches every email the stack sends (share verification codes) and shows it at
  # http://localhost:8025; nothing leaves the machine. The e2e check reads codes from
  # its API.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports: ["127.0.0.1:8025:8025"]

  # PII scanner worker: takes scan requests from the queue, reads and decrypts each
  # file from S3 in memory, and reports what it found to the API's internal port.
  scanner:
    build: ./scanner
    entrypoint: ["/worker"]
    environment:
      VAULTGATE_SCAN_QUEUE_URL: http://localstack:4566/000000000000/vaultgate-local-scans
      VAULTGATE_API_INTERNAL_URL: http://api:8001
      VAULTGATE_SCANNER_TOKEN: dev-scanner-token-change-me
      VAULTGATE_BUCKET: vaultgate-local-vault
      VAULTGATE_AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    depends_on: [api, localstack]

  # --- Observability (M1.5) ---------------------------------------------------
  # Metrics: Prometheus scrapes each service's private metrics port (9100).
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    # Observability UIs have no real auth locally: published on loopback only.
    ports: ["127.0.0.1:9090:9090"]

  # Logs: Alloy tails every container in this project and pushes to Loki.
  # Traces: the services send OTLP to Alloy, which forwards it to Tempo (M6).
  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    # Query API, for the e2e check (logs found by trace ID): loopback only.
    ports: ["127.0.0.1:3100:3100"]

  alloy:
    image: grafana/alloy:v1.21.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only, but Docker socket access is still root-equivalent on the host.
      # Acceptable for a local stack only; Kubernetes collects logs from node files.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Read positions survive restarts, so logs are not re-sent from the beginning.
      - alloy-data:/var/lib/alloy/data
    # 4318 (OTLP/HTTP) is reached by the services inside the network, not published.
    ports: ["127.0.0.1:12345:12345"]
    depends_on: [loki, tempo]

  tempo:
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    # Query API, for Grafana and the e2e check: loopback only, like the other UIs.
    ports: ["127.0.0.1:3200:3200"]

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards/vaultgate:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, loki, tempo]

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  tempo-data:
  grafana-data:
