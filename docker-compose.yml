# Local development stack. Everything here is free: no cloud account is needed.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vaultgate
      POSTGRES_PASSWORD: vaultgate
      POSTGRES_DB: vaultgate
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultgate"]
      interval: 5s
      retries: 10

  # Emulates S3 and KMS so Terraform and the services can run against "AWS" locally.
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,kms,sqs
    ports: ["4566:4566"]

  # OIDC identity provider for local SSO testing.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]

  api:
    build: ./api
    environment:
      VAULTGATE_DATABASE_URL: postgresql://vaultgate:vaultgate@postgres:5432/vaultgate
      VAULTGATE_OIDC_ISSUER: http://keycloak:8080/realms/vaultgate
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    build: ./gateway
    ports: ["8888:8888"]
    depends_on: [api]
