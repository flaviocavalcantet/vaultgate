# Local development stack. Everything here is free: no cloud account is needed.
# The project name is fixed because Alloy collects logs by compose project label.
name: vaultgate

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vaultgate
      POSTGRES_PASSWORD: vaultgate
      POSTGRES_DB: vaultgate
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultgate"]
      interval: 5s
      retries: 10

  # Emulates S3 and KMS so Terraform and the services can run against "AWS" locally.
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,kms,sqs
    ports: ["4566:4566"]

  # OIDC identity provider for local SSO testing.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]

  api:
    build: ./api
    environment:
      VAULTGATE_DATABASE_URL: postgresql+asyncpg://vaultgate:vaultgate@postgres:5432/vaultgate
      VAULTGATE_OIDC_ISSUER: http://keycloak:8080/realms/vaultgate
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    build: ./gateway
    ports: ["8888:8888"]
    depends_on: [api]

  # --- Observability (M1.5) ---------------------------------------------------
  # Metrics: Prometheus scrapes each service's private metrics port (9100).
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    # Observability UIs have no real auth locally: published on loopback only.
    ports: ["127.0.0.1:9090:9090"]

  # Logs: Alloy tails every container in this project and pushes to Loki.
  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only, but Docker socket access is still root-equivalent on the host.
      # Acceptable for a local stack only; Kubernetes collects logs from node files.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Read positions survive restarts, so logs are not re-sent from the beginning.
      - alloy-data:/var/lib/alloy/data
    ports: ["127.0.0.1:12345:12345"]
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, loki]

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
