# Local Prometheus: scrapes every VaultGate service on its private metrics port.
# Service ports 8000/8888 are public; metrics live on 9100 and are only reachable
# inside the compose network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9100"]

  - job_name: gateway
    static_configs:
      - targets: ["gateway:9100"]

  # The observability stack watches itself too, so a broken pipeline is visible.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
