# Automatic architecture and security review of every pull request by Claude.
# This is the repository's only automatic reviewer. Comments are posted by the
# Claude GitHub App (claude[bot]); the criteria live in .github/claude-review.md.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push supersedes a review still running for the previous one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    # Drafts are not ready for review. PRs from forks get no secrets on
    # `pull_request`, so they are skipped instead of failing.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write # exchanged for a Claude GitHub App token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request following .github/claude-review.md exactly.

            - The PR is checked out in the working directory. Get the diff with
              `gh pr diff ${{ github.event.pull_request.number }}` and details with
              `gh pr view ${{ github.event.pull_request.number }}`.
            - Existing inline review threads (read them first, never duplicate them):
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
            - Existing summary: `gh pr view ${{ github.event.pull_request.number }} --comments`.
            - Post each new finding as an inline comment with
              `mcp__github_inline_comment__create_inline_comment` (confirmed: true),
              anchored on a changed line.
            - Summary: if you already posted one on this PR, update it with
              `gh pr comment ${{ github.event.pull_request.number }} --edit-last --body ...`;
              otherwise post it with `gh pr comment ${{ github.event.pull_request.number }} --body ...`.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate)"
