name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, gateway]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaultgate
          POSTGRES_PASSWORD: vaultgate
          POSTGRES_DB: vaultgate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Only the API has database tests; they are skipped when this is empty.
      VAULTGATE_TEST_DATABASE_URL: ${{ matrix.service == 'api' && 'postgresql+asyncpg://vaultgate:vaultgate@localhost:5432/vaultgate_test' || '' }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/envs/local
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false
      - run: terraform validate

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: make obs-check

  auth-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make auth-check
      - if: failure()
        run: docker compose logs keycloak api

  vault-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: make vault-check
      - if: failure()
        run: docker compose logs api gateway scanner localstack mailpit alloy tempo

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/vaultgate
      - run: helm lint deploy/helm/vaultgate -f deploy/helm/vaultgate/ci/local-cluster-values.yaml
      # The rendered manifests against the Kubernetes API schemas (and the Prometheus
      # Operator's, for the ServiceMonitors), with defaults and with everything on. The
      # image and the CRD schema catalog are pinned (digest, commit): bump them on purpose.
      - name: kubeconform
        env:
          KUBECONFORM: ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c
          CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/c86448cbf1a840ca62d119259864863897c8748a
        run: |
          for values in "" "-f deploy/helm/vaultgate/ci/local-cluster-values.yaml"; do
            helm template vaultgate deploy/helm/vaultgate $values |
              docker run -i --rm "$KUBECONFORM" -strict -summary \
                -kubernetes-version 1.31.0 -schema-location default \
                -schema-location "$CRDS/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" -
          done
