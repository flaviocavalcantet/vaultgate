name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, gateway]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaultgate
          POSTGRES_PASSWORD: vaultgate
          POSTGRES_DB: vaultgate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Only the API has database tests; they are skipped when this is empty.
      VAULTGATE_TEST_DATABASE_URL: ${{ matrix.service == 'api' && 'postgresql+asyncpg://vaultgate:vaultgate@localhost:5432/vaultgate_test' || '' }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/envs/local
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false
      - run: terraform validate
      # Each service's IAM policy holds only its own rights (M10, TM-2).
      - run: terraform -chdir=../../modules/access init -backend=false
      - run: terraform -chdir=../../modules/access test

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: make obs-check

  auth-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make auth-check
      - if: failure()
        run: docker compose logs keycloak api

  vault-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: make vault-check
      - if: failure()
        run: docker compose logs api gateway scanner localstack mailpit alloy tempo

  # The images, published to GHCR on every merge to main (M12), tagged with the commit:
  # the tag the chart is given by Argo CD, which sets image.tag to the commit it syncs
  # (deploy/argocd). `main` moves with each merge, for the chart's default. The source
  # label ties the packages to this repository. Pull requests publish nothing: their
  # images are built and loaded into the cluster by the k3d job below.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, gateway, scanner]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/vaultgate-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:main" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            ${{ matrix.service }}
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"

  # The whole system on Kubernetes (M7): a k3d cluster, Argo CD syncing this commit from
  # GitHub, running this commit's images, then the vault end-to-end check and the
  # cluster checks (scripts/k3d.sh). On a pull request the images are built here and
  # loaded into the cluster. On main the cluster pulls the ones the job above published
  # (M12), so every merge proves that what is on GHCR runs.
  k3d-e2e:
    needs: images
    # `images` is skipped on pull requests: run all the same.
    if: ${{ !cancelled() && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    env:
      VAULTGATE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      VAULTGATE_IMAGES: ${{ github.event_name == 'push' && 'pull' || 'build' }}
      # For the node's pulls on main, if the packages aren't public.
      VAULTGATE_GHCR_USER: ${{ github.actor }}
      VAULTGATE_GHCR_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Install k3d
        run: |
          curl -sSfL -o /tmp/k3d https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
          echo "dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      # A software TPM and the TPM tools, for the node enrolled by TPM attestation (M11):
      # swtpm plays the node's TPM, tpm2-tools and OpenSSL's tpm2 provider use it.
      - name: Install swtpm and the TPM tools
        run: sudo apt-get update -q && sudo apt-get install -y -q swtpm swtpm-tools tpm2-tools tpm2-openssl
      - run: make k3d-up
      - run: make k3d-check
      # A short load run with thresholds (M8): no failed request, gateway memory flat,
      # no pod restarts (loadtest/check.py).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r loadtest/requirements.txt
      - run: make load-smoke
      # OWASP ZAP against the API and the gateway (M10), last: its attacks leave files
      # and shares behind. Each warning it reports is in the log.
      - run: make k3d-zap
      - if: failure()
        run: |
          kubectl get applications -n argocd -o wide || true
          kubectl get pods,hpa,networkpolicy -A -o wide || true
          kubectl -n argocd get applications -o yaml | grep -A20 "conditions:\|operationState:" || true
          kubectl get certificates,certificaterequests,clusterissuers,bundles -A -o wide || true
          for ns in vaultgate vaultgate-deps openbao cert-manager monitoring; do kubectl -n $ns logs --all-containers --prefix --tail=200 --max-log-requests=30 -l app.kubernetes.io/name || true; done

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/vaultgate
      - run: helm lint deploy/helm/vaultgate -f deploy/helm/vaultgate/values-k3d.yaml
      - run: helm lint deploy/argocd/local
      - run: helm lint deploy/k3d/observability
      # The rendered manifests against the Kubernetes API schemas (and the Prometheus
      # Operator's and Argo CD's, for their resources): defaults, the k3d values, every
      # option on, and the k3d app of apps. The image and the CRD schema catalog are
      # pinned (digest, commit): bump them on purpose.
      - name: kubeconform
        env:
          KUBECONFORM: ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c
          CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/c86448cbf1a840ca62d119259864863897c8748a
        run: |
          everything="--set ingress.enabled=true --set metrics.serviceMonitor.enabled=true --set tracing.otlpEndpoint=http://alloy:4318"
          for chart in "deploy/helm/vaultgate" "deploy/helm/vaultgate -f deploy/helm/vaultgate/values-k3d.yaml" \
            "deploy/helm/vaultgate -f deploy/helm/vaultgate/values-k3d.yaml $everything" "deploy/argocd/local" \
            "deploy/k3d/observability"; do
            helm template vaultgate $chart |
              docker run -i --rm "$KUBECONFORM" -strict -summary \
                -kubernetes-version 1.31.0 -schema-location default \
                -schema-location "$CRDS/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" -
          done
          # The cluster's dependencies (kustomize; the realm comes from infra/keycloak).
          # Their Certificates (M9) against cert-manager's CRDs.
          kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k3d/deps |
            docker run -i --rm "$KUBECONFORM" -strict -summary -kubernetes-version 1.31.0 \
              -schema-location default -schema-location "$CRDS/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" -
          # OpenBao, and the certificate issuer and trust bundle (M9), against the
          # cert-manager and trust-manager CRDs too.
          for dir in deploy/k3d/openbao deploy/k3d/pki; do
            kubectl kustomize "$dir" |
              docker run -i --rm "$KUBECONFORM" -strict -summary -kubernetes-version 1.31.0 \
                -schema-location default -schema-location "$CRDS/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" -
          done
