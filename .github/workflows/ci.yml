name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, gateway]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaultgate
          POSTGRES_PASSWORD: vaultgate
          POSTGRES_DB: vaultgate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Only the API has database tests; they are skipped when this is empty.
      VAULTGATE_TEST_DATABASE_URL: ${{ matrix.service == 'api' && 'postgresql+asyncpg://vaultgate:vaultgate@localhost:5432/vaultgate_test' || '' }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/envs/local
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false
      - run: terraform validate

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: make obs-check

  auth-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make auth-check
      - if: failure()
        run: docker compose logs keycloak api

  vault-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: make vault-check
      - if: failure()
        run: docker compose logs api gateway localstack

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/vaultgate
