name: Release

# A release is a vX.Y.Z tag on a commit of main whose CI run passed. Nothing is
# rebuilt: the images CI published for that commit (ghcr.io/<owner>/vaultgate-<api|
# gateway|scanner>:<commit>, the ones its k3d job tested) get the version as a second
# tag, and the GitHub Release is made from the notes reviewed with the change
# (docs/releases/vX.Y.Z.md).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
      packages: write # the version tags on the images
      actions: read # CI's result for the tagged commit
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to check the tagged commit is on main

      - name: The tag is on main, and every version says so
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$TAG is not on main" >&2; exit 1; }
          scripts/release_check.sh "$TAG"

      # The images are published before CI's later jobs (the k3d end-to-end run among
      # them) finish, so a published image isn't yet a tested one: only a commit whose CI
      # run on main succeeded, every job, is released.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusions=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch main \
            --event push --json conclusion --jq '[.[].conclusion] | join(" ")')
          [[ " $conclusions " == *" success "* ]] \
            || { echo "no successful CI run on main for $GITHUB_SHA (found: ${conclusions:-none})" >&2; exit 1; }
          echo "ok  CI passed on $GITHUB_SHA"

      # imagetools copies the manifest under the new tag; the digest check proves the
      # version names the very image the commit tag does. A commit with no published
      # images (one that never reached main's CI) fails here, before anything is released.
      - name: Tag the commit's images with the version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for service in api gateway scanner; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/vaultgate-$service"
            docker buildx imagetools create -t "$image:$TAG" "$image:$GITHUB_SHA"
            commit=$(docker buildx imagetools inspect "$image:$GITHUB_SHA" --format '{{json .Manifest.Digest}}')
            version=$(docker buildx imagetools inspect "$image:$TAG" --format '{{json .Manifest.Digest}}')
            [[ $commit == "$version" ]] || { echo "$image:$TAG is not $image:$GITHUB_SHA" >&2; exit 1; }
            echo "ok  $image:$TAG = $GITHUB_SHA ($version)"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --verify-tag --title "VaultGate $TAG" --notes-file "docs/releases/$TAG.md"
