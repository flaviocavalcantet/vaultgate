name: Security

# Static checks of the code, its dependencies, the images and the Kubernetes manifests
# (M10, docs/security-scans.md). Each job fails on a finding, except the third-party
# image scan, which reports (below). A false positive or an accepted finding is
# suppressed where it occurs, with its reason (`# nosec`, `#nosec`, an
# ignore-check.kube-linter.io annotation, a path in .trivyignore.yaml), never by turning
# a rule off for everything. The tools and Semgrep's rules are pinned, so a new finding
# comes from a change here, not from an upgrade; the vulnerability databases (pip-audit,
# govulncheck, Trivy) are not pinned, and a weekly run catches what they learn.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    env:
      SEMGREP_RULES_COMMIT: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.184.0
      # The community rules at a fixed commit, and only their security rules for what
      # the shipped code uses: Python, its libraries, Go, Dockerfiles and secrets.
      - name: Semgrep's rules
        run: |
          git init -q "$RUNNER_TEMP/rules"
          cd "$RUNNER_TEMP/rules"
          git fetch -q --depth 1 https://github.com/semgrep/semgrep-rules "$SEMGREP_RULES_COMMIT"
          git checkout -q FETCH_HEAD
      - name: Scan the shipped code
        run: |
          configs=()
          for d in python/lang python/requests python/jwt python/cryptography \
                   python/sqlalchemy python/fastapi python/boto3 go/lang dockerfile \
                   generic/secrets; do
            configs+=(--config "$RUNNER_TEMP/rules/$d/security")
          done
          semgrep scan --metrics=off --disable-version-check --error "${configs[@]}" \
            --exclude '*_test.go' --exclude tests --exclude testdata \
            api/src gateway/src scanner api/Dockerfile gateway/Dockerfile scanner/Dockerfile

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4
      - run: bandit -r api/src gateway/src

  pip-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, gateway]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      # The dependencies as `pip install` resolves them today, as CI and the images do.
      - run: pip-audit --progress-spinner off ./${{ matrix.service }}

  gosec:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet ./...

  govulncheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # The newest 1.26 patch, as the scanner's image gets from golang:1.26. The
          # runner's cached Go can be a patch behind, and a vulnerability fixed in the
          # newest patch (GO-2026-6859, net/http, fixed in 1.26.11) then fails this job
          # for a Go the image isn't built with.
          check-latest: true
      # Only vulnerabilities in code the scanner calls, in its modules or Go itself.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit, not only the last
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --redact --no-banner .

  # The images as built from the Dockerfiles: known vulnerabilities in their operating
  # system packages and everything installed in them. Only fixable ones fail the job:
  # one with no fix released yet can't be acted on here, and the weekly run picks it up
  # once a fix is out.
  trivy-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, gateway, scanner]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t vaultgate-${{ matrix.service }}:scan ${{ matrix.service }}
      - name: Trivy
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          vaultgate-${{ matrix.service }}:scan

  # The third-party images the local environments run (compose and the k3d cluster:
  # dependencies, OpenBao, observability, Argo CD, cert-manager), as
  # scripts/third_party_images.sh renders them from what is deployed. Reported, not
  # gated: their vulnerabilities are fixed upstream on the vendors' schedules (often in
  # dependencies bundled in their binaries), so a gate would hold every pull request on
  # them. Each image's HIGH and CRITICAL vulnerabilities are in its job's log, and the
  # counts in the run's summary; a fix released upstream is taken by bumping the image.
  third-party-images:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          images=$(scripts/third_party_images.sh)
          echo "$images"
          echo "images=$(echo "$images" | jq -Rnc '[inputs]')" >>"$GITHUB_OUTPUT"

  trivy-third-party:
    needs: third-party-images
    name: trivy ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.third-party-images.outputs.images) }}
    steps:
      - name: Trivy
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          trivy() {
            docker run --rm -v "$RUNNER_TEMP/trivy:/root/.cache" aquasec/trivy:0.76.2 \
              image --scanners vuln --severity HIGH,CRITICAL "$@" "$IMAGE"
          }
          trivy
          trivy --skip-db-update --format json --quiet >"$RUNNER_TEMP/report.json"
          jq -r --arg image "$IMAGE" '[.Results[]?.Vulnerabilities[]?] as $v
            | "| `\($image)` | \([$v[] | select(.Status == "fixed")] | length)"
              + " | \([$v[] | select(.Status != "fixed")] | length) |"' \
            "$RUNNER_TEMP/report.json" >"$RUNNER_TEMP/row"
          {
            echo "| Image | HIGH and CRITICAL, fixed upstream | Not fixed |"
            echo "| --- | --- | --- |"
            cat "$RUNNER_TEMP/row"
          } >>"$GITHUB_STEP_SUMMARY"

  # Misconfigurations in the Dockerfiles, the Helm charts, the Kubernetes manifests and
  # Terraform; accepted findings are in .trivyignore.yaml, each with its reason and path.
  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy
        run: >-
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.76.2
          config --severity MEDIUM,HIGH,CRITICAL --exit-code 1
          --ignorefile .trivyignore.yaml --skip-dirs deploy/k3d/argocd .

  kube-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go install golang.stackrox.io/kube-linter/cmd/kube-linter@v0.8.3
      - run: scripts/kube_lint.sh
