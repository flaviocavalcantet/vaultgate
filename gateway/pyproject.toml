[project]
name = "vaultgate-gateway"
version = "0.1.0"
description = "VaultGate data plane: streaming uploads and downloads with constant memory per connection."
requires-python = ">=3.12"
dependencies = [
    "tornado>=6.4",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultgate_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
