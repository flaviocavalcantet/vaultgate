[project]
name = "vaultgate-gateway"
version = "0.1.0"
description = "VaultGate data plane: streaming uploads and downloads with constant memory per connection."
requires-python = ">=3.12"
dependencies = [
    "tornado>=6.4",
    "prometheus-client>=0.20",
    "cryptography>=43",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "moto[kms,s3]>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultgate_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
