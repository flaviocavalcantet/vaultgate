[project]
name = "vaultgate-api"
version = "0.1.0"
description = "VaultGate control plane: identity, access policies, file metadata, share links and audit log."
requires-python = ">=3.12"
dependencies = [
    # 0.142 added built-in telemetry, which vaultgate_api.tracing turns off.
    "fastapi>=0.142",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    # IANA time zones for policy windows on systems without a zoneinfo database (Windows).
    "tzdata>=2024.1",
    # SQS, for scan requests.
    "boto3>=1.34",
    # Traces (ADR 0008), exported over OTLP/HTTP when an endpoint is configured.
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-asyncpg>=0.66b2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "moto[sqs]>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultgate_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
